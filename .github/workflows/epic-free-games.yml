name: Epic free games to Discord

on:
  schedule:
    - cron: "30 16 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the result instead of posting to Discord"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post free games
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python epic_free_games.py
